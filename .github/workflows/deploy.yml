name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # src/convex/_generated is committed to the repo (Convex requires it for
      # typechecking), so no `convex codegen`/auth is needed in CI.
      - name: Typecheck
        run: bunx tsc -b

      - name: Convex regression tests
        if: ${{ env.CONVEX_DEPLOYMENT != '' }}
        run: bun run test:convex

      - name: Convex regression tests skipped
        if: ${{ env.CONVEX_DEPLOYMENT == '' }}
        run: echo "CONVEX_DEPLOYMENT is not configured; skipping deployed Convex self-tests."

      - name: Validate Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: https://riichiiardo.github.io/11eleven
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL no está configurada"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY no está configurada"; exit 1; }
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL no parece una Project URL válida"; exit 1 ;;
          esac

      - name: Build
        # GitHub Pages serves a project site under /<repo-name>/, so the base
        # is derived from the repository name at runtime. Hardcoding it broke
        # the deploy when the repo was renamed (assets resolved to a 404 path
        # and the page rendered blank).
        run: bunx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Public Convex endpoint (it ships in the client bundle anyway).
          # Override by setting the VITE_CONVEX_URL secret in the repo.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://valuable-hedgehog-471.convex.cloud' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

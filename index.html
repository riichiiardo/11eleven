<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="11Eleven — gestión de clubes, plantillas y presidencia para ligas de fútbol fantasy."
  />
  <meta name="theme-color" content="#0b1a30" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,600..900&family=Inter:wght@300..700&display=swap"
    rel="stylesheet"
  />
  <title>11Eleven · Fantasy Football Manager</title>
  <!-- GitHub Pages SPA redirect: decode the path parked by 404.html.
       Query separators are carried as ~and~ and restored below. -->
  <script type="module">
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>



<body>
  <div id="root"></div>
  <!-- Red de seguridad: si la app no monta (JS/React roto o JS deshabilitado),
       mostramos el error EN PANTALLA en vez de una página en blanco. -->
  <div id="boot-fail" hidden></div>
  <script type="module">
    window.setTimeout(function () {
      var root = document.getElementById("root");
      var fail = document.getElementById("boot-fail");
      if (root && !root.hasChildNodes() && fail) {
        fail.hidden = false;
        fail.innerHTML =
          '<div style="font-family:system-ui;padding:2rem;color:#e2e8f0;background:#0b1a30;min-height:100vh">' +
          '<h2 style="color:#fca5a5">La aplicación no arrancó</h2>';
        window.addEventListener("error", function (e) {
          if (fail) {
            fail.innerHTML +=
              '<pre style="white-space:pre-wrap;color:#93c5fd;font-size:12px">' +
              String(e.message || "") + "\n" + String(e.filename || "") + ":" + String(e.lineno || "") +
              "</pre>";
          }
        });
      }
      // Además, desde el primer momento: cualquier error no capturado se muestra.
      window.addEventListener("error", function (e) {
        var f = document.getElementById("boot-fail");
        if (f && !f.hidden) {
          f.innerHTML +=
            '<pre style="white-space:pre-wrap;color:#93c5fd;font-size:12px">' +
            String(e.message || "") + "\n" + String(e.filename || "") + ":" + String(e.lineno || "") +
            "</pre>";
        }
      });
    }, 3500);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

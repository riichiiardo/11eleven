<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11Eleven · Redirigiendo...</title>
  <script>
    // GitHub Pages SPA redirect for the project site /eleven11/
    // https://github.com/rafgraph/spa-github-pages — pathSegmentsToKeep = 1
    (function (l) {
      var pathSegmentsToKeep = 1; // "/eleven11"
      if (l.search[1] === '/') {
        // Already in encoded form: decode and restore the real route.
        document.title = '11Eleven';
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      } else {
        // Real deep link (e.g. /eleven11/auth?returnTo=...): park the path in
        // the query string so GitHub serves index.html instead of this page.
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    }(window.location));
  </script>
  <meta http-equiv="refresh" content="0;url=/eleven11/" />
  <link rel="canonical" href="/eleven11/" />
  <style>
    body {
      margin: 0;
      background: #0b1a30;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .loading {
      text-align: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .loading h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .loading p {
      opacity: 0.7;
      font-size: 0.875rem;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="loading">
    <h1>⚽ 11Eleven</h1>
    <p>Redirigiendo al centro de control...</p>
  </div>
</body>
</html>

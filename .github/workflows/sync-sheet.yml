name: Sync teams and players from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Sync public sheet to Supabase
        run: node scripts/sync-google-sheet.mjs
        env:
          SHEET_ID: 1Rg-emaBHM2A51OB70erWPT3dbSPxsNaF
          SHEET_GID: 1957949783
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
